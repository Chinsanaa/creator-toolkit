<!-- @dsCard group="Components" viewport="700x250" name="Data display" subtitle="Stat cards, badges, avatars & progress" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--bg-page);padding:26px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:18px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { StatCard, Badge, Avatar, ProgressBar } = window.EarnioDesignSystem_f806e6;
  const Trend = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><path d="M3 17l6-6 4 4 8-8M21 7h-5M21 7v5"/></svg>;
  const Wallet = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><path d="M19 7V5a2 2 0 0 0-2-2H5a2 2 0 0 0 0 4h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5"/><path d="M16 12h.01"/></svg>;
  function Demo(){
    return (
      <div>
        <div className="stats">
          <StatCard label="Total earnings" value="₮12.4M" delta="18.2%" trend="up" hint="vs last month" icon={<Trend/>} />
          <StatCard label="Available to withdraw" value="₮2.1M" hint="Across 3 platforms" icon={<Wallet/>} />
        </div>
        <div className="row">
          <Badge tone="success" dot>Approved</Badge>
          <Badge tone="warning" dot>Pending</Badge>
          <Badge tone="danger" dot>Rejected</Badge>
          <Badge tone="brand">Featured</Badge>
          <Badge tone="neutral">TikTok</Badge>
          <Badge tone="outline">Draft</Badge>
        </div>
        <div className="row">
          <Avatar name="Bold Erdene" size="lg" ring />
          <Avatar name="Sarnai" size="md" />
          <Avatar name="Temuulen" size="sm" />
          <Avatar name="UG" size="xs" />
          <div style={{flex:1,minWidth:'220px'}}>
            <ProgressBar label="Campaign budget" value={3.2} max={5} valueFormat={(v,m)=>`₮${v}M / ₮${m}M`} />
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
