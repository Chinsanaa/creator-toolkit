<!DOCTYPE html>
<!-- @dsCard Components: Data Display -->
<html lang="en"><head><meta charset="UTF-8"><title>Data Display</title>
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;padding:24px;background:var(--surface-muted);font-family:var(--font-body)">
<div id="root"></div>
<script type="text/babel">
function App() {
  return (
    <div style={{display:'flex',flexDirection:'column',gap:'24px'}}>
      <div style={{background:'var(--surface)',borderRadius:'var(--radius-lg)',padding:'24px',border:'1.5px solid var(--border)'}}>
        <div style={{fontSize:'12px',fontWeight:600,color:'var(--text-muted)',letterSpacing:'0.08em',marginBottom:'16px'}}>STAT CARDS</div>
        <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:'12px'}}>
          {[
            {label:'Total Earnings',value:'₮ 4,820,000',delta:'+12.4%',up:true},
            {label:'This Month',value:'₮ 312,500',delta:'-3.1%',up:false},
          ].map(s=>(
            <div key={s.label} style={{background:'var(--surface)',border:'1.5px solid var(--border)',borderRadius:'var(--radius-lg)',padding:'20px'}}>
              <div style={{fontSize:'13px',color:'var(--text-muted)',marginBottom:'4px'}}>{s.label}</div>
              <div style={{fontFamily:'var(--font-mono)',fontSize:'24px',fontWeight:600,fontFeatureSettings:"'tnum' 1"}}>{s.value}</div>
              <div style={{fontSize:'12px',fontWeight:600,color:s.up?'var(--success)':'var(--danger)',marginTop:'4px'}}>{s.up?'↑':'↓'} {s.delta}</div>
            </div>
          ))}
        </div>
      </div>
      <div style={{background:'var(--surface)',borderRadius:'var(--radius-lg)',padding:'24px',border:'1.5px solid var(--border)'}}>
        <div style={{fontSize:'12px',fontWeight:600,color:'var(--text-muted)',letterSpacing:'0.08em',marginBottom:'16px'}}>BADGES</div>
        <div style={{display:'flex',gap:'8px',flexWrap:'wrap'}}>
          {[['neutral','#E8EDF6','#2A3D5C'],['brand','#EEF3FF','#2E5BFF'],['success','#D1FAE5','#10B981'],['warning','#FEF3C7','#B45309'],['danger','#FEE2E5','#F0455A']].map(([t,bg,c])=>(
            <span key={t} style={{display:'inline-flex',alignItems:'center',gap:'4px',padding:'3px 10px',borderRadius:'999px',background:bg,color:c,fontSize:'12px',fontWeight:600}}>
              <span style={{width:'6px',height:'6px',borderRadius:'50%',background:c}}/>
              {t}
            </span>
          ))}
        </div>
      </div>
      <div style={{background:'var(--surface)',borderRadius:'var(--radius-lg)',padding:'24px',border:'1.5px solid var(--border)'}}>
        <div style={{fontSize:'12px',fontWeight:600,color:'var(--text-muted)',letterSpacing:'0.08em',marginBottom:'16px'}}>AVATARS</div>
        <div style={{display:'flex',gap:'12px',alignItems:'center'}}>
          {[28,36,44,56].map(sz=>(
            <div key={sz} style={{width:sz,height:sz,borderRadius:'50%',background:'linear-gradient(135deg,#4D74FF,#2E5BFF)',display:'flex',alignItems:'center',justifyContent:'center',color:'#fff',fontWeight:700,fontSize:Math.round(sz*0.38)}}>БД</div>
          ))}
        </div>
      </div>
      <div style={{background:'var(--surface)',borderRadius:'var(--radius-lg)',padding:'24px',border:'1.5px solid var(--border)'}}>
        <div style={{fontSize:'12px',fontWeight:600,color:'var(--text-muted)',letterSpacing:'0.08em',marginBottom:'16px'}}>PROGRESS BARS</div>
        <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
          {[{label:'TikTok',pct:68},{label:'YouTube',pct:45},{label:'Instagram',pct:23}].map(p=>(
            <div key={p.label}>
              <div style={{display:'flex',justifyContent:'space-between',marginBottom:'4px'}}>
                <span style={{fontSize:'13px',color:'var(--text-secondary)'}}>{p.label}</span>
                <span style={{fontFamily:'var(--font-mono)',fontSize:'13px'}}>{p.pct}%</span>
              </div>
              <div style={{height:'6px',borderRadius:'999px',background:'var(--ink-100)'}}>
                <div style={{height:'100%',width:`${p.pct}%`,borderRadius:'999px',background:'linear-gradient(115deg,#2E5BFF,#12C2F3)'}}/>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
