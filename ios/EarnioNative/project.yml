name: EarnioNative
options:
  bundleIdPrefix: app.earnio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  Earnio:
    path: ..

targets:
  EarnioNative:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.earnio.native
        INFOPLIST_FILE: Info.plist
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
    dependencies:
      - package: Earnio
        product: Earnio

schemes:
  EarnioNative:
    build:
      targets:
        EarnioNative: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
