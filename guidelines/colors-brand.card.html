<!-- @dsCard group="Colors" viewport="700x200" name="Brand · Earnio Blue" subtitle="Primary azure scale — 500 is the brand blue" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans);background:var(--surface);color:var(--text-strong);padding:24px}
  .scale{display:flex;gap:10px}
  .sw{flex:1;display:flex;flex-direction:column;gap:8px}
  .chip{height:64px;border-radius:var(--radius-md);border:1px solid rgba(11,18,32,.06)}
  .name{font-size:11px;font-weight:700;color:var(--text-body)}
  .hex{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
  .star{position:absolute;top:8px;right:8px;color:#fff;font-size:14px}
  .sw.primary .chip{box-shadow:var(--shadow-brand);position:relative}
</style>
</head>
<body>
  <div class="scale" id="scale"></div>
  <script>
    const steps=[['50','#EEF3FF'],['100','#DCE6FF'],['200','#B9CCFF'],['300','#8DA8FF'],['400','#5C7DFF'],['500','#2E5BFF'],['600','#1F45E5'],['700','#1736B8'],['800','#152C8F'],['900','#14266B']];
    document.getElementById('scale').innerHTML=steps.map(([n,h])=>`
      <div class="sw ${n==='500'?'primary':''}">
        <div class="chip" style="background:${h}">${n==='500'?'<span class="star">★</span>':''}</div>
        <div class="name">Blue ${n}</div><div class="hex">${h}</div>
      </div>`).join('');
  </script>
</body>
</html>
