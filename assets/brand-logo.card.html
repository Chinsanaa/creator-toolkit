<!DOCTYPE html>
<!-- @dsCard Brand: Logo -->
<html lang="en"><head><meta charset="UTF-8"><title>Logo Lockups</title>
<link rel="stylesheet" href="../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;padding:24px;background:var(--surface-muted);font-family:var(--font-body)">
<div id="root"></div>
<script type="text/babel">
function Mark({color}) {
  return (
    <svg width="32" height="32" viewBox="0 0 96 96" fill="none">
      {color==='gradient'
        ? <><defs><linearGradient id="g" x1="48" y1="0" x2="48" y2="96" gradientUnits="userSpaceOnUse"><stop offset="0%" stopColor="#4D74FF"/><stop offset="50%" stopColor="#2E5BFF"/><stop offset="100%" stopColor="#1736B8"/></linearGradient></defs>
            <polyline points="16,72 38,44 60,26 82,44" stroke="url(#g)" strokeWidth="7" strokeLinecap="round" strokeLinejoin="round"/>
            <circle cx="16" cy="72" r="5" fill="url(#g)"/></>
        : <><polyline points="16,72 38,44 60,26 82,44" stroke="currentColor" strokeWidth="7" strokeLinecap="round" strokeLinejoin="round"/>
            <circle cx="16" cy="72" r="5" fill="currentColor"/></>}
    </svg>
  );
}
function App() {
  return (
    <div style={{display:'flex',flexDirection:'column',gap:'24px'}}>
      <div style={{background:'var(--surface)',borderRadius:'var(--radius-lg)',padding:'32px',border:'1.5px solid var(--border)',display:'flex',alignItems:'center',gap:'10px'}}>
        <Mark color="gradient"/>
        <span style={{fontFamily:'var(--font-display)',fontSize:'22px',fontWeight:700,letterSpacing:'-0.02em',background:'var(--gradient-brand)',WebkitBackgroundClip:'text',WebkitTextFillColor:'transparent'}}>Earnio</span>
        <span style={{marginLeft:'24px',fontSize:'12px',color:'var(--text-muted)'}}>Color lockup</span>
      </div>
      <div style={{background:'var(--ink-900)',borderRadius:'var(--radius-lg)',padding:'32px',display:'flex',alignItems:'center',gap:'10px'}}>
        <span style={{color:'#fff'}}><Mark color="mono"/></span>
        <span style={{fontFamily:'var(--font-display)',fontSize:'22px',fontWeight:700,letterSpacing:'-0.02em',color:'#fff'}}>Earnio</span>
        <span style={{marginLeft:'24px',fontSize:'12px',color:'rgba(255,255,255,0.4)'}}>Mono on dark</span>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
