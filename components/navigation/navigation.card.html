<!DOCTYPE html>
<!-- @dsCard Components: Tabs -->
<html lang="en"><head><meta charset="UTF-8"><title>Tabs</title>
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;padding:24px;background:var(--surface-muted);font-family:var(--font-body)">
<div id="root"></div>
<script type="text/babel">
const tabs = [{value:'all',label:'All',count:12},{value:'active',label:'Active',count:5},{value:'pending',label:'Pending',count:3},{value:'closed',label:'Closed'}];
function PillTabs({active,setActive}) {
  return (
    <div style={{display:'flex',background:'var(--ink-100)',borderRadius:'999px',padding:'3px',gap:'2px'}}>
      {tabs.map(t=>(
        <button key={t.value} onClick={()=>setActive(t.value)}
          style={{display:'inline-flex',alignItems:'center',gap:'5px',padding:'7px 16px',borderRadius:'999px',border:'none',cursor:'pointer',fontFamily:'var(--font-body)',fontSize:'14px',fontWeight:600,transition:'all 140ms',
          background:active===t.value?'var(--surface)':'transparent',
          color:active===t.value?'var(--primary)':'var(--text-muted)',
          boxShadow:active===t.value?'var(--shadow-sm)':'none'}}>
          {t.label}
          {t.count!==undefined&&<span style={{minWidth:'18px',height:'18px',padding:'0 5px',borderRadius:'999px',background:'var(--primary-soft)',color:'var(--primary)',fontSize:'11px',fontWeight:700,display:'inline-flex',alignItems:'center',justifyContent:'center'}}>{t.count}</span>}
        </button>
      ))}
    </div>
  );
}
function UnderlineTabs({active,setActive}) {
  return (
    <div style={{display:'flex',borderBottom:'2px solid var(--border)'}}>
      {tabs.map(t=>(
        <button key={t.value} onClick={()=>setActive(t.value)}
          style={{display:'inline-flex',alignItems:'center',gap:'5px',padding:'10px 16px',border:'none',borderBottom:`2px solid ${active===t.value?'var(--primary)':'transparent'}`,marginBottom:'-2px',cursor:'pointer',fontFamily:'var(--font-body)',fontSize:'14px',fontWeight:600,transition:'all 140ms',background:'transparent',color:active===t.value?'var(--primary)':'var(--text-muted)'}}>
          {t.label}
        </button>
      ))}
    </div>
  );
}
function App() {
  const [pill,setPill]=React.useState('active');
  const [under,setUnder]=React.useState('all');
  return (
    <div style={{display:'flex',flexDirection:'column',gap:'32px'}}>
      <div style={{background:'var(--surface)',borderRadius:'var(--radius-lg)',padding:'24px',border:'1.5px solid var(--border)'}}>
        <div style={{fontSize:'12px',fontWeight:600,color:'var(--text-muted)',letterSpacing:'0.08em',marginBottom:'16px'}}>PILL (SEGMENTED)</div>
        <PillTabs active={pill} setActive={setPill}/>
      </div>
      <div style={{background:'var(--surface)',borderRadius:'var(--radius-lg)',padding:'24px',border:'1.5px solid var(--border)'}}>
        <div style={{fontSize:'12px',fontWeight:600,color:'var(--text-muted)',letterSpacing:'0.08em',marginBottom:'16px'}}>UNDERLINE</div>
        <UnderlineTabs active={under} setActive={setUnder}/>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
