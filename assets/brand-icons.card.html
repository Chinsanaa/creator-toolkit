<!DOCTYPE html>
<!-- @dsCard Brand: Icons -->
<html lang="en"><head><meta charset="UTF-8"><title>Icons</title>
<link rel="stylesheet" href="../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;padding:24px;background:var(--surface-muted);font-family:var(--font-body)">
<div id="root"></div>
<script type="text/babel">
const lucideIcons = ['home','search','bell','wallet','settings','user','trending-up','bar-chart-2','arrow-right','check','x','plus','download','upload','link','eye','log-out','shield','star','zap'];
function App() {
  return (
    <div style={{background:'var(--surface)',borderRadius:'var(--radius-lg)',padding:'32px',border:'1.5px solid var(--border)'}}>
      <div style={{fontSize:'12px',fontWeight:600,color:'var(--text-muted)',letterSpacing:'0.08em',marginBottom:'8px'}}>LUCIDE LINE ICONS</div>
      <div style={{fontSize:'13px',color:'var(--text-muted)',marginBottom:'20px'}}>All icons from lucide.dev — import individually as needed.</div>
      <div style={{display:'flex',gap:'8px',flexWrap:'wrap'}}>
        {lucideIcons.map(name=>(
          <div key={name} style={{background:'var(--surface-muted)',borderRadius:'var(--radius-sm)',padding:'10px',textAlign:'center',width:'72px'}}>
            <div style={{fontSize:'20px',marginBottom:'4px'}}>◻</div>
            <div style={{fontSize:'9px',color:'var(--text-muted)'}}>{name}</div>
          </div>
        ))}
      </div>
      <div style={{marginTop:'24px',paddingTop:'24px',borderTop:'1.5px solid var(--border)'}}>
        <div style={{fontSize:'12px',fontWeight:600,color:'var(--text-muted)',letterSpacing:'0.08em',marginBottom:'12px'}}>PLATFORM GLYPHS</div>
        <div style={{display:'flex',gap:'12px'}}>
          {['TikTok','YouTube','Instagram'].map(p=>(
            <div key={p} style={{background:'var(--surface-muted)',borderRadius:'var(--radius-sm)',padding:'10px 16px',fontSize:'13px',fontWeight:600,color:'var(--text-secondary)'}}>{p}</div>
          ))}
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
