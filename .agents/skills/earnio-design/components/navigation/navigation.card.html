<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface);padding:30px 26px}
  .stack{display:flex;flex-direction:column;gap:26px;align-items:flex-start}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Tabs } = window.EarnioDesignSystem_f806e6;
  function Demo(){
    const [a,setA] = React.useState('pending');
    const [b,setB] = React.useState('overview');
    return (
      <div className="stack">
        <Tabs variant="pill" value={a} onChange={setA} tabs={[
          {value:'all',label:'All'},
          {value:'pending',label:'Pending',count:3},
          {value:'approved',label:'Approved',count:5},
          {value:'rejected',label:'Rejected'},
        ]} />
        <Tabs variant="underline" value={b} onChange={setB} tabs={[
          {value:'overview',label:'Overview'},
          {value:'earnings',label:'Earnings'},
          {value:'platforms',label:'Platforms'},
        ]} />
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
