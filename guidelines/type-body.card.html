<!DOCTYPE html>
<!-- @dsCard Typography: Body -->
<html lang="en"><head><meta charset="UTF-8"><title>Body Type</title>
<link rel="stylesheet" href="../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;padding:24px;background:var(--surface-muted);font-family:var(--font-body)">
<div id="root"></div>
<script type="text/babel">
function App() {
  return (
    <div style={{background:'var(--surface)',borderRadius:'var(--radius-lg)',padding:'32px',border:'1.5px solid var(--border)'}}>
      <div style={{fontSize:'12px',fontWeight:600,color:'var(--text-muted)',letterSpacing:'0.08em',marginBottom:'24px'}}>PLUS JAKARTA SANS — BODY</div>
      <p style={{fontFamily:'var(--font-body)',fontSize:'18px',fontWeight:400,lineHeight:1.65,color:'var(--text-primary)',margin:'0 0 16px'}}>Connect TikTok, YouTube, and Instagram to see your total earnings across all platforms in one place.</p>
      <p style={{fontFamily:'var(--font-body)',fontSize:'14px',fontWeight:400,lineHeight:1.5,color:'var(--text-secondary)',margin:'0 0 16px'}}>Request a payout to your bank account at any time. Funds arrive within 1–3 business days.</p>
      <div style={{marginTop:'24px',paddingTop:'24px',borderTop:'1.5px solid var(--border)',display:'flex',gap:'32px'}}>
        <div><div style={{fontSize:'12px',color:'var(--text-muted)'}}>Weights</div><div style={{fontWeight:600}}>400 / 500 / 600 / 700 / 800</div></div>
        <div><div style={{fontSize:'12px',color:'var(--text-muted)'}}>Size</div><div style={{fontWeight:600}}>14–18px body</div></div>
        <div><div style={{fontSize:'12px',color:'var(--text-muted)'}}>Leading</div><div style={{fontWeight:600}}>1.5–1.65</div></div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
