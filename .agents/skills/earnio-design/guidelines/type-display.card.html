<!-- @dsCard group="Type" viewport="700x230" name="Display · Space Grotesk" subtitle="Headlines & the wordmark — set tight" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-display);background:var(--surface);color:var(--text-strong);padding:26px}
  .d1{font-size:var(--text-3xl);font-weight:700;letter-spacing:var(--tracking-tighter);line-height:var(--leading-tight)}
  .d2{font-size:var(--text-xl);font-weight:600;letter-spacing:var(--tracking-tight);margin-top:10px}
  .meta{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);margin-top:16px}
</style>
</head>
<body>
  <div class="d1">Earn more, create more</div>
  <div class="d2">The platform for Mongolian creators</div>
  <div class="meta">Space Grotesk · 600–700 · tracking −0.02 to −0.035em</div>
</body>
</html>
