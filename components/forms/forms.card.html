<!DOCTYPE html>
<!-- @dsCard Components: Forms -->
<html lang="en"><head><meta charset="UTF-8"><title>Forms</title>
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;padding:24px;background:var(--surface-muted);font-family:var(--font-body)">
<div id="root"></div>
<script type="text/babel">
function App() {
  const [checked, setChecked] = React.useState(false);
  const [on, setOn] = React.useState(true);
  return (
    <div style={{background:'var(--surface)',borderRadius:'var(--radius-lg)',padding:'32px',border:'1.5px solid var(--border)',maxWidth:'480px'}}>
      <div style={{fontSize:'12px',fontWeight:600,color:'var(--text-muted)',letterSpacing:'0.08em',marginBottom:'24px'}}>FORM ELEMENTS</div>
      <div style={{display:'flex',flexDirection:'column',gap:'20px'}}>
        <div>
          <label style={{display:'block',fontSize:'13px',fontWeight:600,marginBottom:'6px'}}>Email</label>
          <input placeholder="creator@example.mn" style={{width:'100%',minHeight:'44px',padding:'10px 14px',fontFamily:'var(--font-body)',fontSize:'15px',border:'1.5px solid var(--border)',borderRadius:'var(--radius-md)',outline:'none',boxSizing:'border-box'}}/>
        </div>
        <div>
          <label style={{display:'block',fontSize:'13px',fontWeight:600,marginBottom:'6px'}}>Platform</label>
          <select style={{width:'100%',minHeight:'44px',padding:'10px 14px',fontFamily:'var(--font-body)',fontSize:'15px',border:'1.5px solid var(--border)',borderRadius:'var(--radius-md)',background:'var(--surface)',appearance:'none'}}>
            <option>TikTok</option><option>YouTube</option><option>Instagram</option>
          </select>
        </div>
        <label style={{display:'flex',alignItems:'center',gap:'10px',cursor:'pointer'}}>
          <input type="checkbox" checked={checked} onChange={e=>setChecked(e.target.checked)} style={{width:'18px',height:'18px',accentColor:'var(--primary)'}}/>
          <span style={{fontSize:'14px'}}>Agree to terms</span>
        </label>
        <label style={{display:'flex',alignItems:'center',gap:'10px',cursor:'pointer'}}>
          <input type="checkbox" role="switch" checked={on} onChange={e=>setOn(e.target.checked)} style={{width:'40px',height:'22px',accentColor:'var(--primary)'}}/>
          <span style={{fontSize:'14px'}}>Notifications</span>
        </label>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
