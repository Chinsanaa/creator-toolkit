<!DOCTYPE html>
<!-- @dsCard Typography: Numerals -->
<html lang="en"><head><meta charset="UTF-8"><title>Mono Numerals</title>
<link rel="stylesheet" href="../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;padding:24px;background:var(--surface-muted);font-family:var(--font-body)">
<div id="root"></div>
<script type="text/babel">
const examples = [
  {label:'Total Earnings',value:'₮ 4,820,000',size:'32px',weight:600},
  {label:'This Month',value:'₮ 312,500',size:'24px',weight:600},
  {label:'Transaction',value:'₮ 50,000',size:'18px',weight:500},
  {label:'Small stat',value:'₮ 1,200',size:'14px',weight:500},
];
function App() {
  return (
    <div style={{background:'var(--surface)',borderRadius:'var(--radius-lg)',padding:'32px',border:'1.5px solid var(--border)'}}>
      <div style={{fontSize:'12px',fontWeight:600,color:'var(--text-muted)',letterSpacing:'0.08em',marginBottom:'24px'}}>JETBRAINS MONO — NUMERALS</div>
      <div style={{display:'flex',flexDirection:'column',gap:'20px'}}>
        {examples.map(e=>(
          <div key={e.label} style={{display:'flex',alignItems:'baseline',justifyContent:'space-between'}}>
            <span style={{fontSize:'13px',color:'var(--text-muted)',width:'120px'}}>{e.label}</span>
            <span style={{fontFamily:'var(--font-mono)',fontSize:e.size,fontWeight:e.weight,color:'var(--text-primary)',fontFeatureSettings:"'tnum' 1"}}>{e.value}</span>
          </div>
        ))}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
