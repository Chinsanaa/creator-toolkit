<!-- @dsCard group="Spacing" viewport="700x230" name="Spacing scale" subtitle="4px base unit, 1 → 16" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans);background:var(--surface);color:var(--text-strong);padding:24px}
  .r{display:flex;align-items:center;gap:14px;padding:4px 0}
  .tok{font-family:var(--font-mono);font-size:11px;color:var(--text-muted);width:150px;flex:none}
  .bar{height:16px;border-radius:4px;background:var(--gradient-spark)}
</style>
</head>
<body>
  <div id="rows"></div>
  <script>
    const rows=[['--space-1',4],['--space-2',8],['--space-3',12],['--space-4',16],['--space-6',24],['--space-8',32],['--space-12',48],['--space-16',64]];
    document.getElementById('rows').innerHTML=rows.map(([t,px])=>`
      <div class="r"><span class="tok">${t} · ${px}px</span><div class="bar" style="width:${px}px"></div></div>`).join('');
  </script>
</body>
</html>
