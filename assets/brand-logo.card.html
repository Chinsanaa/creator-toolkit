<!-- @dsCard group="Brand" viewport="700x300" name="Logo · mark" subtitle="The Earnio mark on light, soft, and dark surfaces" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../styles.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    background: var(--surface);
    color: var(--text-strong);
    padding: 28px;
  }
  .row { display: flex; gap: 20px; flex-wrap: wrap; }
  .tile {
    flex: 1 1 180px;
    border-radius: var(--radius-xl);
    border: 1px solid var(--border);
    padding: 28px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    text-align: center;
  }
  .tile.light { background: var(--surface); }
  .tile.soft  { background: var(--blue-50); border-color: var(--blue-100); }
  .tile.dark  { background: var(--gradient-ink); border-color: transparent; }
  .tile img { width: 72px; height: 72px; }
  .lockup { display: flex; align-items: center; gap: 12px; }
  .lockup .word {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 28px;
    letter-spacing: var(--tracking-tight);
  }
  .lockup .mark { width: 36px; height: 36px; color: var(--primary); }
  .tile.dark .lockup .word { color: #fff; }
  .tile.dark .lockup .mark { color: #fff; }
  .cap { font-size: 12px; color: var(--text-muted); font-weight: 600; letter-spacing: var(--tracking-wide); text-transform: uppercase; }
  .tile.dark .cap { color: rgba(255,255,255,0.7); }
</style>
</head>
<body>
  <div class="row">
    <div class="tile light">
      <img src="logo/earnio-mark.svg" alt="Earnio mark">
      <div class="cap">Primary tile</div>
    </div>
    <div class="tile soft">
      <div class="lockup">
        <svg class="mark" viewBox="0 0 96 96" fill="none" aria-hidden="true">
          <path d="M34 62 L62 34" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M44 34 H62 V52" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="word">Earnio</span>
      </div>
      <div class="cap">Wordmark lockup</div>
    </div>
    <div class="tile dark">
      <div class="lockup">
        <svg class="mark" viewBox="0 0 96 96" fill="none" aria-hidden="true">
          <path d="M34 62 L62 34" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M44 34 H62 V52" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="word">Earnio</span>
      </div>
      <div class="cap">On ink / dark</div>
    </div>
  </div>
</body>
</html>
