<!-- @dsCard group="Type" viewport="700x160" name="Weights" subtitle="Regular → Extrabold across both families" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:var(--surface);color:var(--text-strong);padding:24px}
  .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
  .w{display:flex;flex-direction:column;gap:4px}
  .big{font-family:var(--font-display);font-size:30px;letter-spacing:-.02em}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
</style>
</head>
<body>
  <div class="grid">
    <div class="w"><span class="big" style="font-weight:400">Aa</span><span class="lbl">400 Regular</span></div>
    <div class="w"><span class="big" style="font-weight:500">Aa</span><span class="lbl">500 Medium</span></div>
    <div class="w"><span class="big" style="font-weight:600">Aa</span><span class="lbl">600 Semibold</span></div>
    <div class="w"><span class="big" style="font-weight:700">Aa</span><span class="lbl">700 Bold</span></div>
    <div class="w"><span class="big" style="font-weight:800;font-family:var(--font-sans)">Aa</span><span class="lbl">800 Extra*</span></div>
  </div>
</body>
</html>
