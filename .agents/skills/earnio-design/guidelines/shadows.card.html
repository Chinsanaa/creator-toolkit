<!-- @dsCard group="Spacing" viewport="700x210" name="Elevation & glow" subtitle="Cool navy-tinted shadows + the brand glow" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans);background:var(--bg-page);padding:30px 24px}
  .grid{display:flex;gap:22px;flex-wrap:wrap}
  .item{display:flex;flex-direction:column;gap:10px;align-items:center}
  .box{width:96px;height:62px;border-radius:var(--radius-lg);background:var(--surface);border:1px solid var(--border)}
  .glow{background:var(--primary);border-color:transparent}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
</style>
</head>
<body>
  <div class="grid">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="lbl">--shadow-sm</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="lbl">--shadow-md</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><span class="lbl">--shadow-lg</span></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xl)"></div><span class="lbl">--shadow-xl</span></div>
    <div class="item"><div class="box glow" style="box-shadow:var(--shadow-brand)"></div><span class="lbl">--shadow-brand</span></div>
  </div>
</body>
</html>
