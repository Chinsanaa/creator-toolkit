<!DOCTYPE html>
<!-- @dsCard Components: Buttons -->
<html lang="en"><head><meta charset="UTF-8"><title>Buttons</title>
<link rel="stylesheet" href="../../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;padding:24px;background:var(--surface-muted);font-family:var(--font-body)">
<div id="root"></div>
<script type="text/babel">
const btnStyle = `
.ern-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;cursor:pointer;font-family:var(--font-body);font-weight:600;letter-spacing:.01em;transition:all 220ms cubic-bezier(.16,1,.3,1);border-radius:999px;white-space:nowrap;}
.ern-btn:disabled{opacity:.5;cursor:not-allowed;}
.ern-btn-sm{padding:8px 16px;font-size:13px;min-height:34px;}
.ern-btn-md{padding:10px 22px;font-size:15px;min-height:44px;}
.ern-btn-lg{padding:14px 32px;font-size:16px;min-height:52px;}
.ern-btn-primary{background:linear-gradient(135deg,#4D74FF,#2E5BFF,#1736B8);color:#fff;box-shadow:0 4px 16px rgba(46,91,255,.32);}
.ern-btn-primary:hover{box-shadow:0 0 20px rgba(46,91,255,.4);transform:translateY(-1px);}
.ern-btn-dark{background:linear-gradient(160deg,#0B1220,#1A2840);color:#fff;}
.ern-btn-dark:hover{opacity:.92;transform:translateY(-1px);}
.ern-btn-secondary{background:#fff;color:#0B1220;border:1.5px solid #A8B8D0;}
.ern-btn-secondary:hover{border-color:#2E5BFF;color:#2E5BFF;}
.ern-btn-ghost{background:transparent;color:#3F577A;}
.ern-btn-ghost:hover{background:#EEF3FF;color:#2E5BFF;}
`;
function Btn({children,variant='primary',size='md'}) {
  return <button className={`ern-btn ern-btn-${variant} ern-btn-${size}`}>{children}</button>;
}
function App() {
  return (
    <div>
      <style>{btnStyle}</style>
      <div style={{background:'var(--surface)',borderRadius:'var(--radius-lg)',padding:'32px',border:'1.5px solid var(--border)'}}>
        <div style={{fontSize:'12px',fontWeight:600,color:'var(--text-muted)',letterSpacing:'0.08em',marginBottom:'24px'}}>BUTTONS — VARIANTS</div>
        <div style={{display:'flex',gap:'12px',marginBottom:'24px',flexWrap:'wrap'}}>
          <Btn variant="primary">Primary</Btn>
          <Btn variant="dark">Dark</Btn>
          <Btn variant="secondary">Secondary</Btn>
          <Btn variant="ghost">Ghost</Btn>
        </div>
        <div style={{fontSize:'12px',fontWeight:600,color:'var(--text-muted)',letterSpacing:'0.08em',marginBottom:'16px'}}>SIZES</div>
        <div style={{display:'flex',gap:'12px',alignItems:'center',flexWrap:'wrap'}}>
          <Btn size="sm">Small</Btn>
          <Btn size="md">Medium</Btn>
          <Btn size="lg">Large</Btn>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
