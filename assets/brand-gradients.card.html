<!DOCTYPE html>
<!-- @dsCard Brand: Gradients -->
<html lang="en"><head><meta charset="UTF-8"><title>Gradients</title>
<link rel="stylesheet" href="../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;padding:24px;background:var(--surface-muted);font-family:var(--font-body)">
<div id="root"></div>
<script type="text/babel">
const gradients = [
  {name:'Brand',token:'--gradient-brand',value:'linear-gradient(135deg, #4D74FF 0%, #2E5BFF 50%, #1736B8 100%)'},
  {name:'Spark',token:'--gradient-spark',value:'linear-gradient(115deg, #2E5BFF 0%, #12C2F3 100%)'},
  {name:'Ink',token:'--gradient-ink',value:'linear-gradient(160deg, #0B1220 0%, #1A2840 100%)'},
];
function App() {
  return (
    <div style={{background:'var(--surface)',borderRadius:'var(--radius-lg)',padding:'32px',border:'1.5px solid var(--border)'}}>
      <div style={{fontSize:'12px',fontWeight:600,color:'var(--text-muted)',letterSpacing:'0.08em',marginBottom:'24px'}}>GRADIENTS</div>
      <div style={{display:'flex',gap:'20px',flexWrap:'wrap'}}>
        {gradients.map(g=>(
          <div key={g.token}>
            <div style={{width:'140px',height:'80px',borderRadius:'var(--radius-lg)',background:g.value,marginBottom:'10px'}}/>
            <div style={{fontSize:'13px',fontWeight:600,color:'var(--text-primary)'}}>{g.name}</div>
            <div style={{fontSize:'11px',color:'var(--text-muted)',fontFamily:'var(--font-mono)'}}>{g.token}</div>
          </div>
        ))}
        <div>
          <div style={{width:'140px',height:'80px',borderRadius:'var(--radius-lg)',background:'var(--mesh-1), var(--mesh-2), var(--mesh-3), var(--surface-muted)',marginBottom:'10px'}}/>
          <div style={{fontSize:'13px',fontWeight:600,color:'var(--text-primary)'}}>Mesh Background</div>
          <div style={{fontSize:'11px',color:'var(--text-muted)',fontFamily:'var(--font-mono)'}}>--mesh-1/2/3</div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
