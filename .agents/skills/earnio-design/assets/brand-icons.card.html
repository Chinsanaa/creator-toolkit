<!-- @dsCard group="Brand" viewport="700x180" name="Iconography · Lucide" subtitle="Line icons at ~1.75px stroke, rounded — plus platform glyphs" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../styles.css">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
  *{box-sizing:border-box}
  body{margin:0;font-family:var(--font-sans);background:var(--surface);color:var(--text-strong);padding:24px}
  .row{display:flex;gap:22px;flex-wrap:wrap;align-items:center}
  .ic{display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--text-body)}
  .ic svg{width:26px;height:26px;stroke-width:1.75}
  .ic.brand svg{color:var(--primary)}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--text-muted)}
  .note{margin-top:18px;font-size:12px;color:var(--text-muted)}
  .pf{display:inline-flex;gap:6px}
</style>
</head>
<body>
  <div class="row">
    <div class="ic brand"><i data-lucide="wallet"></i><span class="lbl">wallet</span></div>
    <div class="ic"><i data-lucide="trending-up"></i><span class="lbl">trending-up</span></div>
    <div class="ic"><i data-lucide="briefcase"></i><span class="lbl">briefcase</span></div>
    <div class="ic"><i data-lucide="search"></i><span class="lbl">search</span></div>
    <div class="ic"><i data-lucide="bell"></i><span class="lbl">bell</span></div>
    <div class="ic"><i data-lucide="bar-chart-3"></i><span class="lbl">bar-chart</span></div>
    <div class="ic"><i data-lucide="settings"></i><span class="lbl">settings</span></div>
    <div class="ic"><i data-lucide="arrow-up-right"></i><span class="lbl">arrow</span></div>
    <div class="ic"><i data-lucide="user"></i><span class="lbl">user</span></div>
    <div class="ic"><i data-lucide="check-circle-2"></i><span class="lbl">check</span></div>
  </div>
  <div class="note">Set: <strong>Lucide</strong> (line, rounded). Platform glyphs (TikTok · YouTube · Instagram) come from Simple Icons. Emoji are never used as icons.</div>
  <script>lucide.createIcons();</script>
</body>
</html>
