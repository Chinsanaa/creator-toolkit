<!DOCTYPE html>
<!-- @dsCard Typography: Weights -->
<html lang="en"><head><meta charset="UTF-8"><title>Type Weights</title>
<link rel="stylesheet" href="../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;padding:24px;background:var(--surface-muted);font-family:var(--font-body)">
<div id="root"></div>
<script type="text/babel">
const weights = [400,500,600,700,800];
function App() {
  return (
    <div style={{background:'var(--surface)',borderRadius:'var(--radius-lg)',padding:'32px',border:'1.5px solid var(--border)'}}>
      <div style={{fontSize:'12px',fontWeight:600,color:'var(--text-muted)',letterSpacing:'0.08em',marginBottom:'24px'}}>WEIGHT RANGE — PLUS JAKARTA SANS</div>
      <div style={{display:'flex',flexDirection:'column',gap:'16px'}}>
        {weights.map(w=>(
          <div key={w} style={{display:'flex',alignItems:'baseline',gap:'16px'}}>
            <span style={{fontFamily:'var(--font-mono)',fontSize:'11px',color:'var(--text-muted)',width:'40px'}}>{w}</span>
            <span style={{fontFamily:'var(--font-body)',fontSize:'20px',fontWeight:w,color:'var(--text-primary)'}}>Earnio creator platform</span>
          </div>
        ))}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
