<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body{margin:0;font-family:var(--font-sans);background:var(--surface);padding:26px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;max-width:640px}
  .stack{display:flex;flex-direction:column;gap:16px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { Input, Select, Checkbox, Switch } = window.EarnioDesignSystem_f806e6;
  const Search = () => <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>;
  function Demo(){
    return (
      <div className="grid">
        <div className="stack">
          <Input label="Email" type="email" placeholder="you@example.com" defaultValue="" />
          <Input label="Amount (MNT)" icon={<Search/>} placeholder="0" hint="Minimum ₮50,000" />
          <Input label="Account number" defaultValue="0042" error="Account number is required" />
        </div>
        <div className="stack">
          <Select label="Bank account" options={['Khan Bank','Golomt Bank','XacBank','Trade & Development Bank']} />
          <div style={{display:'flex',flexDirection:'column',gap:'12px',marginTop:'4px'}}>
            <Checkbox label="I accept the Terms and Privacy Policy" defaultChecked />
            <Checkbox label="Send me brand-deal alerts" />
            <Switch label="Auto-sync earnings" defaultChecked />
            <Switch label="Email notifications" />
          </div>
        </div>
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body>
</html>
