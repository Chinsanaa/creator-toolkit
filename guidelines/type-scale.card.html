<!DOCTYPE html>
<!-- @dsCard Typography: Scale -->
<html lang="en"><head><meta charset="UTF-8"><title>Type Scale</title>
<link rel="stylesheet" href="../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;padding:24px;background:var(--surface-muted);font-family:var(--font-body)">
<div id="root"></div>
<script type="text/babel">
const scale = [
  {token:'--text-5xl',size:'48px',label:'5xl'},
  {token:'--text-4xl',size:'40px',label:'4xl'},
  {token:'--text-3xl',size:'32px',label:'3xl'},
  {token:'--text-2xl',size:'24px',label:'2xl'},
  {token:'--text-xl',size:'20px',label:'xl'},
  {token:'--text-lg',size:'18px',label:'lg'},
  {token:'--text-base',size:'16px',label:'base'},
  {token:'--text-sm',size:'14px',label:'sm'},
  {token:'--text-xs',size:'12px',label:'xs'},
];
function App() {
  return (
    <div style={{background:'var(--surface)',borderRadius:'var(--radius-lg)',padding:'32px',border:'1.5px solid var(--border)'}}>
      <div style={{fontSize:'12px',fontWeight:600,color:'var(--text-muted)',letterSpacing:'0.08em',marginBottom:'24px'}}>TYPE SCALE</div>
      <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
        {scale.map(s=>(
          <div key={s.token} style={{display:'flex',alignItems:'center',gap:'16px'}}>
            <span style={{fontFamily:'var(--font-mono)',fontSize:'11px',color:'var(--text-muted)',width:'80px'}}>{s.token}</span>
            <span style={{fontSize:s.size,fontWeight:500,color:'var(--text-primary)',lineHeight:1.2}}>Earnio platform</span>
          </div>
        ))}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
