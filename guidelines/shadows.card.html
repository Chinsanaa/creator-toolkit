<!DOCTYPE html>
<!-- @dsCard Spacing: Shadows -->
<html lang="en"><head><meta charset="UTF-8"><title>Shadows</title>
<link rel="stylesheet" href="../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;padding:24px;background:var(--surface-muted);font-family:var(--font-body)">
<div id="root"></div>
<script type="text/babel">
const shadows = [
  {name:'sm',token:'--shadow-sm'},{name:'md',token:'--shadow-md'},{name:'lg',token:'--shadow-lg'},
  {name:'xl',token:'--shadow-xl'},{name:'glow',token:'--shadow-glow'},{name:'brand',token:'--shadow-brand'},
];
function App() {
  return (
    <div style={{background:'var(--surface)',borderRadius:'var(--radius-lg)',padding:'32px',border:'1.5px solid var(--border)'}}>
      <div style={{fontSize:'12px',fontWeight:600,color:'var(--text-muted)',letterSpacing:'0.08em',marginBottom:'24px'}}>SHADOWS + GLOW</div>
      <div style={{display:'flex',gap:'24px',flexWrap:'wrap'}}>
        {shadows.map(s=>(
          <div key={s.token} style={{textAlign:'center'}}>
            <div style={{width:'72px',height:'72px',borderRadius:'var(--radius-md)',background:'var(--surface)',boxShadow:`var(${s.token})`,marginBottom:'12px'}}/>
            <div style={{fontSize:'12px',fontWeight:600,color:'var(--text-primary)'}}>{s.name}</div>
            <div style={{fontSize:'10px',color:'var(--text-muted)',fontFamily:'var(--font-mono)'}}>{s.token}</div>
          </div>
        ))}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
