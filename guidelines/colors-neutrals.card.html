<!DOCTYPE html>
<!-- @dsCard Colors: Neutrals -->
<html lang="en"><head><meta charset="UTF-8"><title>Neutrals</title>
<link rel="stylesheet" href="../styles.css">
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body style="margin:0;padding:24px;background:var(--surface-muted);font-family:var(--font-body)">
<div id="root"></div>
<script type="text/babel">
const swatches = [
  {name:'Ink 50',hex:'#F4F7FC'},{name:'Ink 100',hex:'#E8EDF6'},{name:'Ink 200',hex:'#CDD6E8'},
  {name:'Ink 300',hex:'#A8B8D0'},{name:'Ink 400',hex:'#7F96B5'},{name:'Ink 500',hex:'#5B7498'},
  {name:'Ink 600',hex:'#3F577A'},{name:'Ink 700',hex:'#2A3D5C'},{name:'Ink 800',hex:'#1A2840'},
  {name:'Ink 900',hex:'#0B1220'},
];
function App() {
  return (
    <div>
      <h2 style={{fontFamily:'var(--font-display)',fontSize:'20px',fontWeight:700,color:'var(--text-primary)',marginBottom:'16px'}}>Ink (Slate) Scale</h2>
      <div style={{display:'flex',gap:'8px',flexWrap:'wrap'}}>
        {swatches.map(s=>(
          <div key={s.hex} style={{width:'88px'}}>
            <div style={{height:'56px',borderRadius:'var(--radius-md)',background:s.hex,border:'1.5px solid rgba(0,0,0,0.06)'}}/>
            <div style={{fontSize:'11px',fontWeight:600,marginTop:'6px',color:'var(--text-primary)'}}>{s.name}</div>
            <div style={{fontSize:'11px',color:'var(--text-muted)',fontFamily:'var(--font-mono)'}}>{s.hex}</div>
          </div>
        ))}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body></html>
